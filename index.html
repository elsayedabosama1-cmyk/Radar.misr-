<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مِرصد</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111E31"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--navy:#111E31;--blue:#168C91;--gold:#C9A968;--red:#d4202c;--bg:#F4F1E9;--card:#fff;--tx:#111E31;--mut:#6a6f7b;--ln:#e3ddcc;--fs:1}
body.dark{--bg:#0c1624;--card:#15233a;--tx:#eef1fa;--mut:#9aa5c0;--ln:#243450}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px*var(--fs))}
body{font-family:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.7;padding-bottom:30px}
header{position:sticky;top:0;z-index:5;background:var(--navy);border-bottom:3px solid var(--gold);color:#fff;padding:8px 14px;display:flex;align-items:center;gap:8px}
header img{width:46px;height:46px;border-radius:50%}
header h1{font-size:1.3rem;flex:1;font-weight:800}
.ib{background:rgba(255,255,255,.16);border:0;color:#fff;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
#tk{background:var(--red);color:#fff;display:flex;align-items:center;gap:10px;padding:6px 14px;font-weight:700;font-size:.95rem}
#tk b{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
#tk b:before{content:"";width:10px;height:10px;border-radius:50%;background:#fff;animation:p 1.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(255,255,255,.85)}100%{box-shadow:0 0 0 11px rgba(255,255,255,0)}}
@media(prefers-reduced-motion:reduce){#tk b:before{animation:none}}
#tt{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#tabs,.sub{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;position:sticky;top:62px;background:var(--bg);z-index:4}
#tabs button,.sub button{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:20px;padding:5px 16px;font:inherit;font-weight:600}
#tabs button.on,.sub button.on{background:var(--blue);border-color:var(--blue);color:#fff}
#v{padding:4px 12px 20px;max-width:720px;margin:auto}
.card{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:14px;border:1px solid var(--ln)}
.im,.hero{position:relative;height:190px;background-size:cover;background-position:center}
.hero{height:230px;border-radius:12px;margin-bottom:10px}
.wm{position:absolute;left:8px;bottom:8px;width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:url(logo.png) center/cover}
.cb{padding:10px 14px 12px}.cb h3{font-size:1.08rem;line-height:1.6;margin:4px 0}
.tg{display:inline-block;background:var(--blue);color:#fff;font-size:.78rem;font-weight:700;border-radius:6px;padding:0 10px}
.tg.br{background:var(--red)}
.mut,small{color:var(--mut)}.empty{text-align:center;color:var(--mut);padding:40px 0}
#sh{position:fixed;inset:0;background:var(--bg);z-index:9;overflow:auto;padding:12px;display:none}
#sh.on{display:block}
.art{max-width:720px;margin:auto}.art h2{font-size:1.4rem;line-height:1.6;margin:8px 0}
.body{margin:14px 0;font-size:1.05rem;line-height:2}
.bar{display:flex;gap:8px;margin-bottom:10px}
.bar button,.acts button,.ob{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 14px;font:inherit}
.sig{display:flex;align-items:center;gap:8px;border-top:1px solid var(--ln);padding-top:10px;font-weight:800;color:var(--blue)}
.sig img{width:30px;height:30px;border-radius:50%}
.box{max-width:340px;margin:25vh auto 0;display:grid;gap:10px}
.pb{background:var(--red);color:#fff;border:0;border-radius:10px;padding:10px;font:inherit;font-weight:700}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx)}
.form{display:grid;gap:6px}.form label{font-weight:700;margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modes{display:flex;gap:16px}.modes input,.pgs input{width:auto}
.pgs{display:grid;gap:2px;max-height:170px;overflow:auto;border:1px solid var(--ln);border-radius:10px;padding:8px}
#pv img{max-width:100%;border-radius:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.acts{display:flex;gap:6px;flex:none}.acts .dl{color:var(--red)}
.st.published{color:#188038}.st.pending{color:#b26a00}.st.scheduled{color:var(--blue)}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.kp div{background:var(--card);border:1px solid var(--ln);border-radius:12px;text-align:center;padding:12px}.kp b{display:block;font-size:1.8rem;color:var(--blue)}
h4{margin:14px 0 6px}.bars{display:grid;grid-template-columns:70px 1fr 30px;align-items:center;gap:8px}.bars i{height:10px;background:var(--gold);border-radius:5px}
#ts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#10131c;color:#fff;padding:8px 18px;border-radius:20px;opacity:0;pointer-events:none;z-index:20;transition:opacity .2s}
#ts.on{opacity:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}.tile{border-top:3px solid var(--gold);position:relative;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;font:inherit;color:var(--tx);text-align:center}.tile svg{width:38px;height:38px;color:var(--blue)}.tile strong{font-size:1rem;line-height:1.4}.tile .nbadge{position:absolute;top:8px;left:8px;margin:0}.filea{text-decoration:none;color:var(--tx)}.filea svg{width:26px;height:26px;color:var(--blue);flex:none}.filea b{flex:1}#ft{text-align:center;color:var(--mut);padding:14px 12px;display:none}.thumb{width:100%;border-radius:12px;margin-top:8px}
#tabs button{position:relative}.gsel{margin:6px 0 10px}.note{background:#fff4d6;color:#5a3d00;border-radius:10px;padding:8px 12px;margin:10px 0;border:1px solid #f0d28a}body.dark .note{background:#3a2f10;color:#ffe3a3;border-color:#6b5520}a.pb{display:block;text-align:center;text-decoration:none;margin:8px 0}.nbadge{display:inline-block;margin-inline-start:6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font:700 12px/20px sans-serif;text-align:center;font-style:normal}#tabs button.on .nbadge{background:#fff;color:var(--red)}.newchip{display:inline-block;background:var(--red);color:#fff;border-radius:6px;padding:0 8px;font-size:.75rem;font-weight:700;margin-inline-start:6px}
</style></head><body>
<header><img src="logo.png" alt=""><h1 id="hTitle">مِرصد</h1>
<button class="ib" aria-label="بحث" onclick="srch()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
<button class="ib" aria-label="الوضع الليلي" onclick="D.dark=!D.dark;save();render()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
<button class="ib" aria-label="الإدارة" onclick="adm()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg></button></header>
<div id="tk"><b id="tkl">عاجل</b><span id="tt"></span></div>
<div id="ins" style="display:none;background:var(--blue);color:#fff;padding:6px 14px;align-items:center;justify-content:space-between;font-weight:700"><span>ثبّت مِرصد على موبايلك</span><button onclick="inst()" style="border:0;border-radius:8px;padding:4px 14px;font:inherit;font-weight:700">تثبيت</button></div>
<nav id="tabs"></nav><main id="v"></main><footer id="ft"></footer><div id="sh"></div><div id="ts"></div>
<script>
const CATS=['عاجل','المحليات','أخبار مصر','سياسة وبرلمان','عرب وعالم','اقتصاد وأعمال','حوادث وقضايا','تعليم','رياضة','تكنولوجيا','ثقافة وفن','تحقيقات وتقارير','فيديوهات'];
const GOVS=['القاهرة','الجيزة','الإسكندرية','القليوبية','الشرقية','الدقهلية','الغربية','المنوفية','البحيرة','كفر الشيخ','دمياط','بورسعيد','الإسماعيلية','السويس','شمال سيناء','جنوب سيناء','الفيوم','بني سويف','المنيا','أسيوط','سوهاج','قنا','الأقصر','أسوان','البحر الأحمر','الوادي الجديد','مطروح'];
const PAGES=['بتوقيت المحله','By the way','احنا معاك يا بلال','رادار مصر','حزب التجمع','Elsayed Mohamed','راصد الشارع','بصمه تاتيه','عين مصر','كامب إعداد القائد الصغير'];
const STL={published:'منشور',draft:'مسودة',pending:'بانتظار الاعتماد',scheduled:'مجدول'};
const $=s=>document.querySelector(s),now=()=>Date.now();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const REPO='elsayedabosama1-cmyk/Radar.misr-',BR='main',FILE='data/news.json',RAW='https://raw.githubusercontent.com/'+REPO+'/'+BR+'/',API='https://api.github.com/repos/'+REPO+'/contents/';
let D,NEWS=[],X={texts:{},folders:[],pages:[],plan:[]},S={view:'home',fpath:[],afp:[],cat:'الكل',gov:'',q:'',admin:0,tab:'list',edit:null,img:''},tki=0,TOK='',SINCE=0,VC=-1;
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=b=>decodeURIComponent(escape(atob(b.replace(/\s/g,''))));
const IC={news:'<path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 8h3v9a2 2 0 0 1-2 2"/><path d="M7 9h7M7 13h7"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',egypt:'<path d="M12 4L3 20h18z"/><path d="M12 4v16"/>',gov:'<path d="M3 9l9-5 9 5"/><path d="M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',chart:'<path d="M5 20V10M11 20V4M17 20v-7M3 20h18"/>',warn:'<path d="M12 3L2 20h20z"/><path d="M12 10v5M12 17.5v.5"/>',cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/>',ball:'<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.5 5.5c4 3 9 3 13 0M5.5 18.5c4-3 9-3 13 0"/>',chip:'<path d="M3 5h18v11H3z"/><path d="M8 20h8M12 16v4"/>',art:'<path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 1.5-2s0-2 1.5-2h2a3 3 0 0 0 3-3 9 9 0 0 0-8-11z"/><circle cx="8" cy="11" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16" cy="11" r="1"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',video:'<path d="M3 5h18v14H3z"/><path d="M10 9l5 3-5 3z"/>',bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',folder:'<path d="M3 6h6l2 2h10v11H3z"/>',file:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/>'};
const CI={'عاجل':'bolt','المحليات':'pin','أخبار مصر':'egypt','سياسة وبرلمان':'gov','عرب وعالم':'globe','اقتصاد وأعمال':'chart','حوادث وقضايا':'warn','تعليم':'cap','رياضة':'ball','تكنولوجيا':'chip','ثقافة وفن':'art','تحقيقات وتقارير':'search','فيديوهات':'video'};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]||IC.news}</svg>`;
const TK=[['title','اسم التطبيق','مِرصد'],['tk','شارة الأخبار العاجلة','عاجل'],['all','أيقونة كل الأخبار','كل الأخبار'],['saved','أيقونة المحفوظ','المحفوظ'],['foot','سطر أسفل الصفحة (اختياري)','نرصد المشهد.. ونصنع التأثير']].concat(CATS.map(c=>['c:'+c,'قسم: '+c,c]));
function lbl(k){const d=(TK.find(x=>x[0]===k)||[])[2]||'';return(X.texts&&X.texts[k])||d}
function applyTexts(){$('#hTitle').textContent=lbl('title');$('#tkl').textContent=lbl('tk');const f=lbl('foot');$('#ft').textContent=f;$('#ft').style.display=f?'block':'none'}
const imgU=u=>u&&!/^(data:|https?:)/.test(u)?RAW+u:(u||'');
function load(){try{D=JSON.parse(localStorage.getItem('rm2')||'null')}catch(e){D=null}
 if(!D)D={dark:0,fs:1,saved:[],drafts:[],seenC:{},first:now(),last:now()};
 D.saved=D.saved||[];D.drafts=D.drafts||[];D.seenC=D.seenC||{};D.first=D.first||now();
 SINCE=D.last||D.first;D.last=now();save();
 try{NEWS=JSON.parse(localStorage.getItem('rmNews')||'[]')}catch(e){NEWS=[]}
 try{TOK=localStorage.getItem('rmTok')||''}catch(e){}
 try{X=JSON.parse(localStorage.getItem('rmX')||'null')||X}catch(e){}}
function save(){try{localStorage.setItem('rm2',JSON.stringify(D))}catch(e){toast('المساحة ممتلئة')}}
function toast(m){const e=$('#ts');e.textContent=m;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2800)}
function sheet(h){$('#sh').innerHTML=h;$('#sh').className='on'}
function closeSheet(){$('#sh').className=''}
function ago(t){const m=Math.floor((now()-t)/6e4);return m<1?'الآن':m<60?'منذ '+m+' دقيقة':m<1440?'منذ '+Math.floor(m/60)+' ساعة':new Date(t).toLocaleDateString('ar-EG')}
const toLocal=t=>new Date(t-new Date(t).getTimezoneOffset()*6e4).toISOString().slice(0,16);
const vis=n=>(n.st==='published'||n.st==='scheduled')&&n.at<=now();
const pub=()=>NEWS.filter(vis).sort((a,b)=>b.at-a.at);
const gn=id=>NEWS.find(x=>x.id===id)||D.drafts.find(x=>x.id===id);
function ticker(){const l=pub().filter(n=>n.cat==='عاجل').slice(0,5),e=$('#tk');if(!l.length){e.style.display='none';return}e.style.display='flex';tki=(tki+1)%l.length;$('#tt').textContent=l[tki].t}
function render(){applyTexts();document.body.classList.toggle('dark',!!D.dark);document.documentElement.style.setProperty('--fs',D.fs);$('#tabs').style.display=S.admin?'none':'flex';VC=pub().length;S.admin?renderAdmin():renderHome();ticker()}
async function sync(){if(Date.now()-(D.ls||0)<6e5)return;try{const r=await fetch(RAW+FILE+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(!Array.isArray(j.news))return;const nx={texts:j.texts||{},folders:j.folders||[],pages:j.pages||[],plan:j.plan||[]};if(JSON.stringify([j.news,nx])===JSON.stringify([NEWS,X]))return;NEWS=j.news;X=nx;try{localStorage.setItem('rmNews',JSON.stringify(NEWS));localStorage.setItem('rmX',JSON.stringify(X))}catch(e){}if(!S.admin&&$('#sh').className!=='on')render()}catch(e){}}
function card(n){return`<article class="card" onclick="openN('${n.id}')">${n.img?`<div class="im" style="background-image:url(${imgU(n.img)})"><i class="wm"></i></div>`:''}<div class="cb"><span class="tg ${n.cat==='عاجل'?'br':''}">${n.cat}</span>${n.at>SINCE?'<span class="newchip">جديد</span>':''}<h3>${esc(n.t)}</h3><small>${ago(n.at)}${n.gov?' · '+esc(n.gov):''}</small></div></article>`}
function nb(c){if(c==='محفوظ')return'';const f=Math.max(D.first,D.seenC[c]||0),k=pub().filter(n=>(c==='الكل'||n.cat===c)&&n.at>f).length;return k?`<i class="nbadge">${k>9?'9+':k}</i>`:''}
function openCat(c){S.cat=c;S.view='cat';D.seenC[c]=now();save();render();scrollTo(0,0)}
function toHome(){S.view='home';S.q='';S.gov='';S.fpath=[];render();scrollTo(0,0)}
function tile(ic,t,fn,bd){return`<button class="tile" onclick="${fn}">${bd||''}${icon(ic)}<strong>${esc(t)}</strong></button>`}
function fcnt(f,since){return(f.files||[]).filter(x=>x.ts>since).length+(f.folders||[]).reduce((a,x)=>a+fcnt(x,since),0)}
function fb(f){const k=fcnt(f,Math.max(D.first,D.seenC['f:'+f.id]||0));return k?`<i class="nbadge">${k>9?'9+':k}</i>`:''}
function openF(id,top){if(top)S.fpath=[id];else S.fpath.push(id);S.view='fol';D.seenC['f:'+id]=now();save();render();scrollTo(0,0)}
function curF(){let a=X.folders||[],f=null;for(const id of S.fpath){f=a.find(x=>x.id===id);if(!f)return null;a=f.folders||[]}return f}
function renderHome(){
 if(S.view==='cat')return renderCat();if(S.view==='fol')return renderFol();
 $('#v').innerHTML=`<div class="grid">${tile('news',lbl('all'),"openCat('الكل')",nb('الكل'))}${CATS.map(c=>tile(CI[c]||'news',lbl('c:'+c),`openCat('${c}')`,nb(c))).join('')}${tile('bookmark',lbl('saved'),"openCat('محفوظ')")}${(X.folders||[]).map(f=>tile('folder',f.name,`openF('${f.id}',1)`,fb(f))).join('')}</div>`}
function renderCat(){
 let l=pub();if(S.cat==='محفوظ')l=l.filter(n=>D.saved.includes(n.id));else if(S.cat!=='الكل')l=l.filter(n=>n.cat===S.cat);
 if(S.gov)l=l.filter(n=>n.gov===S.gov);
 if(S.q)l=l.filter(n=>(n.t+n.b+(n.kw||'')).includes(S.q));
 const t=S.cat==='الكل'?lbl('all'):S.cat==='محفوظ'?lbl('saved'):lbl('c:'+S.cat);
 $('#v').innerHTML=`<div class="bar"><button onclick="toHome()">رجوع</button><b style="flex:1;align-self:center">${esc(t)}</b></div><select class="gsel" onchange="S.gov=this.value;render()"><option value="">كل المحافظات</option>${GOVS.map(g=>`<option ${g===S.gov?'selected':''}>${g}</option>`).join('')}</select>`+(S.q?`<p class="mut">نتائج البحث عن "${esc(S.q)}" <button class="ob" onclick="S.q='';render()">مسح</button></p>`:'')+(l.length?l.map(card).join(''):'<p class="empty">لا توجد أخبار هنا بعد.</p>')}
function fileCard(x){const u=RAW+x.url,nw=x.ts>SINCE?'<span class="newchip">جديد</span>':'';return x.kind==='img'?`<div class="card" onclick="viewImg('${x.id}')"><div class="im" style="background-image:url(${u})"></div><div class="cb"><b>${esc(x.title)}</b>${nw}</div></div>`:`<a class="row filea" href="${u}">${icon('file')}<b>${esc(x.title)}</b>${nw}</a>`}
function viewImg(id){const f=curF(),x=(f.files||[]).find(y=>y.id===id);if(x)sheet(`<div class="art"><div class="bar"><button onclick="closeSheet()">رجوع</button></div><h3>${esc(x.title)}</h3><img class="thumb" src="${RAW+x.url}" alt=""></div>`)}
function renderFol(){const f=curF();if(!f){S.view='home';return renderHome()}
 const subs=f.folders||[],fl=f.files||[];
 $('#v').innerHTML=`<div class="bar"><button onclick="goBack()">رجوع</button><b style="flex:1;align-self:center">${esc(f.name)}</b></div>${subs.length?`<div class="grid">${subs.map(x=>tile('folder',x.name,`openF('${x.id}')`,fb(x))).join('')}</div>`:''}${fl.map(fileCard).join('')}${!subs.length&&!fl.length?'<p class="empty">المجلد فاضي.</p>':''}`}
function srch(){sheet(`<div class="box"><h3>بحث في الأخبار</h3><input id="sq" placeholder="اكتب كلمة البحث"><button class="pb" onclick="S.q=$('#sq').value.trim();S.cat='الكل';S.view='cat';closeSheet();render()">بحث</button><button class="ob" onclick="closeSheet()">إلغاء</button></div>`);setTimeout(()=>$('#sq').focus(),50)}
function openN(id){const n=gn(id);if(!n)return;

async function mutate(fn,msg){
 for(let i=0;i<3;i++){
  const r=await gh('GET',FILE);let db={news:[]},sha;
  if(r.status===200){const j=await r.json();sha=j.sha;db=JSON.parse(dec(j.content))}else if(r.status!==404)throw new Error('تعذّر قراءة البيانات ('+r.status+')');
  if(!Array.isArray(db.news))db.news=[];
  fn(db);db.version=(db.version||0)+1;
  const w=await gh('PUT',FILE,{message:msg||'Update news (admin)',content:enc(JSON.stringify(db)),branch:BR,sha});
  if(w.status===200||w.status===201){NEWS=db.news;X={texts:db.texts||{},folders:db.folders||[],pages:db.pages||[],plan:db.plan||[]};D.ls=Date.now();save();try{localStorage.setItem('rmNews',JSON.stringify(NEWS));localStorage.setItem('rmX',JSON.stringify(X))}catch(e){}return}
  if(w.status===409||w.status===422)continue;
  if(w.status===401||w.status===403)throw new Error('المفتاح مالوش صلاحية الكتابة (Contents: Read and write)');
  throw new Error('فشل الحفظ ('+w.status+')')}
 throw new Error('تعارض في الحفظ، جرّب تاني')}

function pgEd(id){const x=(X.pages||[]).find(y=>y.id===id)||{},n=(prompt('اسم الصفحة',x.name||'')||'').trim();if(!n)return;
 const pf=(prompt('المنصة: '+PLAT.join(' / '),x.platform||'Facebook')||'').trim()||'Facebook',sl=(prompt('مواعيد النشر اليومية (مثال: 10:00 ص، 7:00 م)',x.slots||'')||'').trim();
 pgSave(db=>{const e=db.pages.find(y=>y.id===id);if(e)Object.assign(e,{name:n,platform:pf,slots:sl});else db.pages.push({id:'p'+now().toString(36),name:n,platform:pf,slots:sl})},'Page: '+n)}
function pgDel(id){if(confirm('حذف الصفحة؟'))pgSave(db=>{db.pages=db.pages.filter(y=>y.id!==id)},'Delete page')}
function pgSeed(){const k=[['بتوقيت المحلة','Facebook'],['بتوقيت المحلة','Instagram'],['رادار مصر','Facebook'],['By The Way','Facebook'],['حزب التجمع – أمانة الغربية','Facebook'],['حزب التجمع – أمانة الغربية','Instagram']];
 pgSave(db=>{k.forEach((x,i)=>{if(!db.pages.some(y=>y.name===x[0]&&y.platform===x[1]))db.pages.push({id:'p'+now().toString(36)+i,name:x[0],platform:x[1],slots:''})})},'Seed pages')}
function plEd(id){const pg=X.pages||[];if(!pg.length)return toast('ضيف صفحة الأول');const x=(X.plan||[]).find(y=>y.id===id)||{};
 sheet(`<div class="art"><div class="bar"><button onclick="closeSheet()">رجوع</button></div><div class="form"><label>الصفحة</label><select id="p_g">${pg.map(g=>`<option value="${g.id}" ${g.id===x.page?'selected':''}>${esc(g.name)} – ${esc(g.platform)}</option>`).join('')}</select><label>عنوان المنشور</label><input id="p_t" value="${esc(x.title)}"><div class="two"><div><label>النوع</label><select id="p_y">${PTYPES.map(t=>`<option ${t===x.type?'selected':''}>${t}</option>`).join('')}</select></div><div><label>الحالة</label><select id="p_s">${Object.keys(PST).map(t=>`<option value="${t}" ${t===x.status?'selected':''}>${PST[t]}</option>`).join('')}</select></div></div><label>الموعد</label><input type="datetime-local" id="p_w" value="${x.at?toLocal(x.at):''}"><label>المسؤول عن النشر</label><input id="p_o" value="${esc(x.who)}"><label>رابط المنشور (بعد النشر)</label><input id="p_u" value="${esc(x.url)}"><button class="pb" onclick="plSave('${id||''}')">حفظ</button></div></div>`)}
function plSave(id){const v={page:$('#p_g').value,title:$('#p_t').value.trim(),type:$('#p_y').value,status:$('#p_s').value,at:new Date($('#p_w').value).getTime(),who:$('#p_o').value.trim(),url:$('#p_u').value.trim()};if(!v.title||!v.at)return toast('اكتب العنوان والموعد');closeSheet();
 pgSave(db=>{const e=id&&db.plan.find(y=>y.id===id);if(e)Object.assign(e,v);else db.plan.push(Object.assign({id:'q'+now().toString(36)},v))},'Plan: '+v.title.slice(0,40))}
function plSt(id,st){pgSave(db=>{const e=db.plan.find(y=>y.id===id);if(e)e.status=st},'Plan status')}
function plDel(id){if(confirm('حذف المنشور من التقويم؟'))pgSave(db=>{db.plan=db.plan.filter(y=>y.id!==id)},'Delete plan item')}
function aStats(){const p=pub(),mx=Math.max(1,...CATS.map(c=>p.filter(n=>n.cat===c).length));
 $('#ad').innerHTML=`<div class="kp"><div><b>${p.length}</b>خبر منشور</div><div><b>${NEWS.filter(n=>n.st==='scheduled'&&n.at>now()).length}</b>مجدول</div></div><h4>الأخبار حسب القسم</h4>${CATS.map(c=>{const k=p.filter(n=>n.cat===c).length;return`<div class="bars"><span>${c}</span><i style="width:${k/mx*100}%"></i><em>${k}</em></div>`}).join('')}`}
function fs(d){D.fs=Math.min(1.4,Math.max(.8,+(D.fs+d).toFixed(2)));save();render()}
async function importOld(){let o;try{o=JSON.parse(localStorage.getItem('rm')||'null')}catch(e){}
 const l=((o&&o.news)||[]).filter(n=>/^n/.test(n.id)&&(n.st==='published'||n.st==='scheduled'));
 if(!l.length)return toast('مفيش أخبار قديمة على الجهاز');if(!confirm('نقل '+l.length+' خبر قديم للنظام الجديد؟'))return;
 try{for(const n of l){if(n.img&&n.img.startsWith('data:'))n.img=await upImg(n.img,n.id+'.jpg');delete n.v}
  await mutate(db=>{const ids=new Set(db.news.map(x=>x.id));l.forEach(n=>{if(!ids.has(n.id))db.news.push(n)});db.news.sort((a,b)=>b.at-a.at)},'Import old news');toast('تم النقل');render()}catch(e){toast(e.message)}}
