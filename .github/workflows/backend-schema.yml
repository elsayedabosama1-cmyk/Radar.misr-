name: Validate backend schema

on:
  pull_request:
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/backend-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mirsad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mirsad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase auth roles for schema validation
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d mirsad_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            raw_user_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb
          );
          CREATE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE
          AS $$ SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          SQL
      - name: Apply migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d mirsad_test -v ON_ERROR_STOP=1 -f supabase/migrations/0001_identity_editorial_core.sql
