name: Release signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copy web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html logo.png icon-192.png icon-512.png manifest.json android/app/src/main/assets/
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MIRSAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mirsad-release.jks"
          echo "MIRSAD_KEYSTORE_PATH=$RUNNER_TEMP/mirsad-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          MIRSAD_KEYSTORE_PASSWORD: ${{ secrets.MIRSAD_KEYSTORE_PASSWORD }}
          MIRSAD_KEY_ALIAS: ${{ secrets.MIRSAD_KEY_ALIAS }}
          MIRSAD_KEY_PASSWORD: ${{ secrets.MIRSAD_KEY_PASSWORD }}
        run: |
          test -n "$MIRSAD_KEYSTORE_PASSWORD"
          test -n "$MIRSAD_KEY_ALIAS"
          test -n "$MIRSAD_KEY_PASSWORD"
          gradle assembleRelease --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: mirsad-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
