name: Import news
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-news
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import, generate pages, commit
        run: |
          git config user.name "mirsad-bot"
          git config user.email "mirsad-bot@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/import_rss.py
            python3 scripts/gen_pages.py
            git add data n sitemap.xml robots.txt
            if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
            git commit -q -m "Import news [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
