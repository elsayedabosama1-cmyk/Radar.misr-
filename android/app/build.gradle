plugins { id 'com.android.application' }
android {
    namespace 'org.radarmisr.app'
    compileSdk 34
    defaultConfig {
        applicationId 'org.radarmisr.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        main {
            storeFile file('radar.keystore')
            storePassword 'radar123'
            keyAlias 'radar'
            keyPassword 'radar123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.main }
        release { signingConfig signingConfigs.main }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'androidx.core:core:1.13.1'
}
