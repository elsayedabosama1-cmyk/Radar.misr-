plugins { id 'com.android.application' }

android {
    namespace 'org.radarmisr.app'
    compileSdk 34

    buildFeatures { buildConfig true }

    defaultConfig {
        def syncApi = System.getenv('MIRSAD_API_BASE_URL') ?: ''
        buildConfigField 'String', 'MIRSAD_API_BASE_URL', '"' + syncApi.replace('"', '') + '"'
        applicationId 'org.radarmisr.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('MIRSAD_KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('MIRSAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MIRSAD_KEY_ALIAS')
                keyPassword System.getenv('MIRSAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Use the standard Android debug signing key.
        }
        release {
            // Release builds are signed only when all signing secrets are supplied.
            if (System.getenv('MIRSAD_KEYSTORE_PATH') &&
                System.getenv('MIRSAD_KEYSTORE_PASSWORD') &&
                System.getenv('MIRSAD_KEY_ALIAS') &&
                System.getenv('MIRSAD_KEY_PASSWORD')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'androidx.core:core:1.13.1'
}
